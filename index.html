<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Minimalo</title>
</head>
<body>
<header class="header header-sticky">
    <!-- la premiere partie du header (la partie noire) -->
    <div class="contact padding">
        <!-- la partie gauche  -->
        <div class="gauche">
            <p>Lorem ipsum dolor sit amet</p>

        </div>
        <!-- la partie doite -->
        <div class="droite">
            <a href="">My account</a>
            <a href="">Checkout</a>
        </div>

    </div>
    <div class="text">
        <h1>MINIMALO</h1>
    </div>
    <!-- la navigation -->
    <nav class="navigation padding">
        <!-- la partie des reseaux sociaux -->
        <div class="social">
            <img src="icons/icon-facebook.png" alt="icon-facebook">
            <img src="icons/icon-twitter.png" alt="icon-twitter">
            <img src="icons/icon-instagram.png" alt="icon-instagram">

        </div>
        <!-- liste des navigation -->
        <ul class="navigation-list">
            <li><a href="#">HOME</a></li>
            <li><a href="#">POST</a></li>
            <li><a href="#">INSPIRATION</a></li>
            <li><a href="#">SHOP</a></li>
            <li><a href="#">PAGES</a></li>
        </ul>
        <!-- la partie notification et recherche -->
        <div class="notification">
            <span>
                <img src="icons/icon-cloche.png" alt="icon-notification">
            </span>

            <span>
                <img src="icons/icon-recherche.png" alt="icon recherche">
            </span>

        </div>
    </nav>



</header>
